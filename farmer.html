<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Dashboard</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        html,
        body {
            height: 100vh;
            overflow: hidden;
        }

        body {
            height: 100vh;
            display: grid;
            height: 100vh;
            grid-template-columns: 250px 1fr;
            grid-template-rows: 50px 1fr 30px;
        }

        .sidebar {
            grid-column: 1;
            grid-row: 1 / -1;
            background-color: #f4faf6;
            position: sticky;
            top: 0;
            height: 100vh;
            padding: 15px;
        }

        .sidebar-list{
            display: flex;
            flex-direction: column;
            gap: 10px;
            list-style: none;
        }
        .list{
            width: 100%;
            height: 40px;
            
            border-radius: 10px;
            color: rgb(0, 0, 0);
            display: flex;
            align-items: center ;
            justify-content: left;
            padding-left: 10px;
        }
        .list:hover{
            background-color: #3f9765;
            color: white;
            cursor: pointer;
        }
        .navbar {
            grid-column: 2;
            grid-row: 1;
            background-color: #ffffff;
            position: sticky;
            display: flex;
            justify-content: flex-end;
            padding: 5px 50px 5px 5px;
            align-items: center;
            gap: 5px;
            border-bottom: 2px solid #dbdbdb; 
        }

        .notification{
            border-radius: 50%;
        }
        .notification:hover{
            border-radius: 50%;
            background-color: #dbdbdb;
            cursor: pointer;
        }

        .main-sec {
            grid-column: 2;
            grid-row: 2;
            background-color: #ffffff;
            padding: 20px;
            overflow-y: auto;
        }

        .footer-sec {
            grid-column: 2;
            grid-row: 3;
            position: sticky;
            padding: 10px;
            font-size: smaller;
            color: #868686;
            border-top: 2px solid #dbdbdb;
        }
    </style>
</head>

<body>
    <header class="navbar">
        <img class="notification"  src="assets/Farmer dashboard/notification-svgr.svg" alt="notification-svgr" height="100%">
        <span style="color: #dbdbdb;">| </span>
        <span>
            <img src="assets/Farmer-png.webp" height="40px" alt="Farmer-png">
        </span>
        <span>
            Farmer name
        </span>
    </header>
    <aside class="sidebar">
        <img src="assets/logo-removedbg.webp" style="margin-bottom: 10px;" width="90%" alt="logo">
        <ul class="sidebar-list">
            <li class="list">Dashboard</li>
            <li class="list">My Produce</li>
            <li class="list">My Orders</li>
            <li class="list">AI Insights</li>
            <li class="list">Logistics & Pickup</li>
        </ul>
    </aside>
    <main class="main-sec"></main>
    <footer class="footer-sec">© 2026 Kisansetu. All right reserved.</footer>
</body>

</html>
